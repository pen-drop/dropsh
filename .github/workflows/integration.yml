name: integration

# DDEV-backed integration tests.
#
# Provisions the full multisite fixture (4 Drupal sites + mariadb) via DDEV on
# the GitHub-hosted runner, then runs `pnpm run test:integration` against it.
# ubuntu-latest ships Docker, and DDEV binds its router to 127.0.0.1 and writes
# the fixture hostnames (*.dropsh-test.ddev.site) to /etc/hosts, so the vitest
# runner reaches the sites over plain HTTP with no extra networking setup.
#
# Heavier and slower than `validate` (composer install + 4 drush site:installs),
# so it only runs on pull requests and pushes to the release branches.

on:
  pull_request:
  push:
    branches: ["1.x", "1.0.x"]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Install DDEV + Docker prerequisites without auto-starting a project;
      # our `drupal:up` script drives `ddev start` and provisioning itself.
      - uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Provision DDEV multisite fixture
        run: pnpm run drupal:up

      - name: Debug schemata schema (temporary)
        run: |
          TOKEN=$(curl -s -X POST http://schemata.dropsh-test.ddev.site/oauth/token \
            -d "grant_type=password&client_id=tests-password&client_secret=tests-password-secret&username=tester&password=tester-pw&scope=integration:content" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          curl -s -H "Authorization: Bearer $TOKEN" \
            "http://schemata.dropsh-test.ddev.site/schemata/node/article_test?_format=schema_json&_describes=api_json" \
            | python3 -m json.tool | head -120

      - name: Run integration tests
        run: pnpm run test:integration

      - name: Tear down DDEV
        if: always()
        working-directory: tests/integrations/drupal
        run: ddev delete -Oy || true
