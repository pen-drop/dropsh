workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - validate

.pnpm:
  image: node:${NODE_VERSION}-alpine
  cache:
    key:
      files:
        - pnpm-lock.yaml
      prefix: "pnpm-node${NODE_VERSION}"
    paths:
      - .pnpm-store/
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

lint:
  extends: .pnpm
  stage: validate
  variables:
    NODE_VERSION: "20"
  script:
    - pnpm run lint

typecheck:
  extends: .pnpm
  stage: validate
  parallel:
    matrix:
      - NODE_VERSION: ["20", "22"]
  script:
    - pnpm run typecheck

test:
  extends: .pnpm
  stage: validate
  parallel:
    matrix:
      - NODE_VERSION: ["20", "22"]
  script:
    - pnpm test
